services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app  # local dev only
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment: &backend-env
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      WORKFLOWS_PATH: /config/workflows.yaml
    volumes:
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - ./config:/config:ro
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
