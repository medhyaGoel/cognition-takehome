name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL --retry 10 --retry-delay 6 --retry-all-errors --retry-max-time 180 -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan full git history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: semgrep (python, OWASP top 10, secrets)
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/owasp-top-ten --config p/secrets

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --strict --progress-spinner off -r backend/requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
      - name: npm audit (high+)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm audit --audit-level=high
          fi
      - name: No frontend yet
        if: hashFiles('frontend/package.json') == ''
        run: echo "frontend/package.json not present; skipping npm audit"
